<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Online | SYP ON CAFÉ</title><link rel="stylesheet" href="order.css"></head><body>
<header><a href="/">←</a><div><b>SYP ON CAFÉ</b><small>Native Online Ordering</small></div><a href="/account/">Account</a></header>
<section class="hero"><h1>Order your favorites</h1><p>Pickup or delivery. No redirect to script.google.com.</p></section>
<main><div class="toolbar"><input id="search" placeholder="Search coffee, matcha, soda..."><div id="cats"></div></div><div id="status">Loading menu…</div><section id="products"></section></main>
<button id="cartBtn" class="cartbtn">Cart <span id="cartCount">0</span> · <b id="cartTotal">₱0</b></button>
<div id="drawer" class="drawer" hidden><div class="sheet"><button id="close">×</button><h2>Your order</h2><div id="cart"></div><div class="sum"><span>Subtotal</span><b id="subtotal">₱0</b></div><hr><h3>Customer details</h3><label>Name<input id="name"></label><label>Mobile<input id="mobile" inputmode="numeric" placeholder="09XXXXXXXXX"></label><div class="grid"><label>Order type<select id="orderType"><option value="PICKUP">Pickup</option><option value="DELIVERY">Delivery</option></select></label><label>Payment<select id="payment"><option value="CASH">Cash</option><option value="GCASH">GCash</option></select></label></div><label id="addressWrap" hidden>Delivery address<textarea id="address"></textarea></label><label>Notes<textarea id="notes"></textarea></label><button id="place" class="primary">Place Order</button><p id="message"></p></div></div>
<script src="order.js"></script></body></html>
