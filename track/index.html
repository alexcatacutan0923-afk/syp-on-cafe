<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order | SYP</title><style>*{box-sizing:border-box}body{margin:0;background:#32180c;color:#29140b;font-family:Arial}.wrap{max-width:560px;margin:50px auto;padding:18px}.card{background:#fff8f2;border-radius:22px;padding:24px}input,button{width:100%;padding:14px;border-radius:12px;font-size:16px}input{border:1px solid #d6bdab}button{border:0;background:#ffbd3d;font-weight:800;margin-top:10px}.result{margin-top:20px;padding:16px;border-radius:14px;background:#f2e5dc}.bar{height:10px;background:#dbc8ba;border-radius:9px}.fill{height:100%;background:#5a2b16;border-radius:9px}</style></head><body><div class="wrap"><div class="card"><a href="/order/">← Back to order</a><h1>Find My Order</h1><p>Enter your secure tracking token.</p><input id="token" placeholder="Tracking token"><button id="find">Check Status</button><div id="out"></div></div></div><script>const q=new URLSearchParams(location.search);token.value=q.get('t')||'';find.onclick=async()=>{out.innerHTML='<p>Checking…</p>';try{const r=await fetch('/api/v3',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'trackOrder',trackingToken:token.value.trim()})});const d=await r.json();if(!d.success)throw new Error(d.message);const o=d.order;out.innerHTML=`<div class="result"><small>${o.orderNo}</small><h2>${o.statusIcon||''} ${o.status}</h2><p>${o.customerMessage||''}</p><div class="bar"><div class="fill" style="width:${o.progress||5}%"></div></div><p><b>Total:</b> ₱${Number(o.total||0).toLocaleString('en-PH')}</p></div>`}catch(e){out.innerHTML='<div class="result">'+e.message+'</div>'}};if(token.value)find.click();</script></body></html>
