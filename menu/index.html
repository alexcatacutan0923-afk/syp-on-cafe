<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#211109">
  <title>Menu | SYP ON CAFÉ</title>
  <link rel="icon" href="/assets/images/logo.webp">
  <link rel="stylesheet" href="/menu/menu.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-button" href="/" aria-label="Back to home">←</a>
    <a class="brand" href="/">
      <img src="/assets/images/logo.webp" alt="SYP ON CAFÉ logo">
      <span><strong>SYP ON CAFÉ</strong><small>Street • Iced • Brewed</small></span>
    </a>
    <a class="order-button" href="/order">ORDER</a>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">OPEN DAILY • 5PM–4AM</p>
      <h1>What are you craving?</h1>
      <p>Browse the live SYP menu. Prices and availability come directly from the café system.</p>
    </section>

    <section class="controls" aria-label="Menu controls">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Search coffee, matcha, soda…" autocomplete="off">
      </label>
      <div id="categories" class="categories" aria-label="Menu categories"></div>
    </section>

    <section class="menu-section">
      <div class="section-head">
        <div>
          <h2 id="sectionTitle">All Menu</h2>
          <p id="productCount">Connecting to SYP menu…</p>
        </div>
        <button id="refreshButton" class="refresh" type="button">Refresh</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <strong>Loading fresh menu…</strong>
        <span>Please wait a moment.</span>
      </div>

      <div id="products" class="product-grid" hidden></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Quick links">
    <a class="active" href="/menu"><span>☕</span>Menu</a>
    <a href="/order"><span>🛍️</span>Order</a>
    <a href="/track"><span>📍</span>Track</a>
    <a href="/loyalty"><span>⭐</span>Rewards</a>
  </nav>

  <script src="/menu/menu.js" defer></script>
</body>
</html>
